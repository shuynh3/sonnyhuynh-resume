<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply a saved theme before first paint (same as themeScript in @sonnyhuynh/ui). -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonny Huynh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
